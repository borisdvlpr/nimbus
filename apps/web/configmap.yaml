# Non-secret configuration for epicshelter, injected as environment variables.
#
# CACHE_URL points at the in-cluster Valkey Service. Valkey speaks the Redis wire
# protocol, so redis:// URLs and go-redis work unchanged. The DNS name is stable:
# <service>.<namespace>.svc.cluster.local, and Valkey has no auth by default
# (it is never exposed outside the pod network — see docs/04-apps.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: web-config
  namespace: apps
  labels:
    app.kubernetes.io/name: web
    app.kubernetes.io/part-of: nimbus
data:
  CACHE_URL: "valkey.apps.svc.cluster.local:6379"
