apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: web
  namespace: apps
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: web            # the HTTP listener on the shared Gateway
  hostnames:
    - app.nimbus                  # add to tailnet DNS, or send a Host: app.nimbus header
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: web               # the web Service (port 80)
          port: 80
