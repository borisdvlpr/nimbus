---
# Reboot recovery (health-gated) and an optional off-device PV backup. This is all
# host-level systemd — nothing runs in-cluster, so there is no steady-state RAM cost.

# --- reboot recovery (installed in both modes) ---
- name: Ensure nimbus config dir
  ansible.builtin.file:
    path: "{{ nimbus_conf_dir }}"
    state: directory
    mode: "0755"

- name: Install the recovery script
  ansible.builtin.copy:
    src: nimbus-recovery.sh
    dest: /usr/local/bin/nimbus-recovery.sh
    mode: "0755"

- name: Render recovery environment
  ansible.builtin.template:
    src: recovery.env.j2
    dest: "{{ nimbus_conf_dir }}/recovery.env"
    mode: "0644"

- name: Install the recovery systemd unit
  ansible.builtin.template:
    src: nimbus-recovery.service.j2
    dest: /etc/systemd/system/nimbus-recovery.service
    mode: "0644"

- name: Enable the recovery unit (runs at boot)
  ansible.builtin.systemd:
    name: nimbus-recovery.service
    enabled: true
    daemon_reload: true

# --- unattended self-heal: persist secrets on the node (root-only) ---
# SECURITY: this writes the age key and git deploy key to the SD card at rest.
# Only runs when recovery.unattended is true.
- name: Configure unattended self-heal (persist secrets on the node)
  when: recovery.unattended | bool
  block:
    - name: Secrets dir (root-only)
      ansible.builtin.file:
        path: "{{ nimbus_secrets_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"

    - name: Persist the age key on the node
      ansible.builtin.copy:
        src: "{{ bootstrap.age_key_path }}"
        dest: "{{ nimbus_secrets_dir }}/age.key"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Persist the git deploy key on the node (ssh auth)
      ansible.builtin.copy:
        src: "{{ bootstrap.git_private_key_path }}"
        dest: "{{ nimbus_secrets_dir }}/deploy.key"
        owner: root
        group: root
        mode: "0600"
      no_log: true
      when: bootstrap.git_auth == 'ssh'

- name: Remove persisted secrets when unattended is disabled (secure default)
  when: not (recovery.unattended | bool)
  ansible.builtin.file:
    path: "{{ nimbus_secrets_dir }}"
    state: absent

# --- optional PV backup ---
- name: Install the backup script
  ansible.builtin.copy:
    src: nimbus-backup.sh
    dest: /usr/local/bin/nimbus-backup.sh
    mode: "0755"

- name: Render backup environment
  ansible.builtin.template:
    src: backup.env.j2
    dest: "{{ nimbus_conf_dir }}/backup.env"
    mode: "0644"

- name: Install the backup service + timer units
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "/etc/systemd/system/{{ item.dest }}"
    mode: "0644"
  loop:
    - { src: nimbus-backup.service.j2, dest: nimbus-backup.service }
    - { src: nimbus-backup.timer.j2, dest: nimbus-backup.timer }

- name: Enable or disable the backup timer per backup.enabled
  ansible.builtin.systemd:
    name: nimbus-backup.timer
    enabled: "{{ backup.enabled | bool }}"
    state: "{{ 'started' if (backup.enabled | bool) else 'stopped' }}"
    daemon_reload: true
